openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: contact
    description: Contact form operations
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /contact:
    post:
      operationId: submitContactForm
      tags: [contact]
      summary: Send a contact form submission
      description: Delivers a contact form submission to Albrecht Works.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ContactFormRequest"
      responses:
        "200":
          description: Contact form submission delivered
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContactFormResponse"
        "400":
          description: Invalid contact form submission
        "502":
          description: Email delivery failed
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    ContactFormRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 2
        businessName:
          type: string
          minLength: 2
        email:
          type: string
          pattern: '^[^\s@]+@[^\s@]+\.[^\s@]+$'
        phone:
          type: string
        message:
          type: string
      required:
        - name
        - businessName
        - email
    ContactFormResponse:
      type: object
      properties:
        success:
          type: boolean
      required:
        - success

